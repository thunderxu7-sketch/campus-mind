name: checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  plan-and-reference-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campus_mind
          POSTGRES_USER: campus_mind_migration
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U campus_mind_migration -d campus_mind"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      CAMPMIND_MASTER_KEY: ci-only-test-key
      CAMPMIND_DEMO_MFA: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: apply and inspect PostgreSQL reference migration
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql --host 127.0.0.1 --port 5432 --username campus_mind_migration --dbname campus_mind --set ON_ERROR_STOP=1 --file infra/migrations/001_initial.sql
          test "$(psql --host 127.0.0.1 --port 5432 --username campus_mind_migration --dbname campus_mind --tuples-only --no-align --command "select count(*) from information_schema.tables where table_schema = 'public';")" = "36"
          test "$(psql --host 127.0.0.1 --port 5432 --username campus_mind_migration --dbname campus_mind --tuples-only --no-align --command "select count(*) from pg_class where relnamespace = 'public'::regnamespace and relrowsecurity and relforcerowsecurity;")" = "36"
          test "$(psql --host 127.0.0.1 --port 5432 --username campus_mind_migration --dbname campus_mind --tuples-only --no-align --command "select count(*) from pg_policies where schemaname = 'public';")" = "36"
          test "$(psql --host 127.0.0.1 --port 5432 --username campus_mind_migration --dbname campus_mind --tuples-only --no-align --command "select count(*) from information_schema.columns where table_name = 'media_assets' and column_name = 'object_key';")" = "1"
          test "$(psql --host 127.0.0.1 --port 5432 --username campus_mind_migration --dbname campus_mind --tuples-only --no-align --command "select count(*) from pg_constraint where conname in ('campaigns_created_by_fk','risk_cases_assigned_to_fk','availability_slots_counselor_fk','attempts_submission_fk');")" = "4"
          psql --host 127.0.0.1 --port 5432 --username campus_mind_migration --dbname campus_mind --set ON_ERROR_STOP=1 --file infra/roles.sql.example
          test "$(psql --host 127.0.0.1 --port 5432 --username campus_mind_migration --dbname campus_mind --tuples-only --no-align --command "select rolsuper::int || '|' || rolbypassrls::int from pg_roles where rolname = 'campus_mind_app';")" = "0|0"
          test "$(psql --host 127.0.0.1 --port 5432 --username campus_mind_migration --dbname campus_mind --tuples-only --no-align --command "select has_table_privilege('campus_mind_app', 'public.audit_events', 'UPDATE')::int || '|' || has_table_privilege('campus_mind_app', 'public.audit_events', 'DELETE')::int;")" = "0|0"
      - run: npm run build
      - run: npm test
      - run: npm run drill:capacity
      - run: npm run drill:recovery
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/security-check.mjs
      - run: npm run release:check
      - run: python3 scripts/check_plan.py
      - run: python3 -m unittest discover -s tests -v
