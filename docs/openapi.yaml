openapi: 3.1.0
info:
  title: Campus Mind API
  version: 0.1.0
  description: |
    合成数据参考 API。筛查反馈不是医学诊断；风险信号必须由有授权的心理专业人员复核。
    生产环境必须替换本地 JsonStore、演示身份和 synthetic_only 量表，并通过 M4 Gate。
servers:
  - url: http://localhost:8787
    description: Local reference server only
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses: {'200': {description: OK}}
  /v1/auth/login:
    post:
      security: []
      summary: Login with a named account or one-time phone-less student credential
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Login'}}}
      responses: {'200': {description: Session}, '401': {description: Invalid credentials, spent credential or MFA required}, '429': {description: Login rate limit exceeded}}
  /v1/admin/student-credentials:
    post: {summary: Issue a one-time short-lived student terminal credential, responses: {'201': {description: Credential shown once}, '403': {description: Organization permission required}}}
  /v1/admin/students:
    get: {summary: List scoped student directory metadata without names or psychological fields, responses: {'200': {description: Student directory}, '403': {description: Organization permission required}}}
  /v1/admin/campaigns:
    get: {summary: List scoped campaign metadata and participant counts, responses: {'200': {description: Campaign list}}}
  /v1/admin/scales:
    get:
      summary: List tenant scale versions and approval metadata without item prompts
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [draft, approved, revoked]}}
        - {name: population, in: query, required: false, schema: {type: string, enum: [primary, middle, high, mixed]}}
        - {name: minAge, in: query, required: false, schema: {type: integer, minimum: 6, maximum: 19}}
        - {name: maxAge, in: query, required: false, schema: {type: integer, minimum: 6, maximum: 19}}
      responses: {'200': {description: Scale catalog with licenseState and suitability metadata}, '400': {description: Invalid catalog filter}, '403': {description: Scale or campaign read permission required}}
  /v1/admin/users/{userId}/sessions/revoke:
    post:
      summary: Revoke all active sessions and unspent terminal credentials for a scoped user
      parameters: [{$ref: '#/components/parameters/userId'}]
      responses: {'200': {description: Revocation count}, '403': {description: Organization permission required}, '404': {description: User outside the administrator scope}}
  /v1/auth/logout:
    post: {summary: Revoke current session, responses: {'204': {description: Revoked}}}
  /v1/guardian-links:
    post: {summary: Create a pending guardian relationship for verification, responses: {'201': {description: Pending relationship}}}
  /v1/guardian-links/{linkId}/verify:
    post: {summary: Verify a guardian relationship, parameters: [{$ref: '#/components/parameters/linkId'}], responses: {'200': {description: Verified relationship}}}
  /v1/me/consents:
    get: {summary: List the authenticated subject's purpose-bound consent metadata, responses: {'200': {description: Consent metadata without actor identifiers}, '403': {description: Student or guardian role required}}}
    post: {summary: Record a purpose-bound student, guardian or school legal-basis participation record; a changed notice creates a new active version, responses: {'201': {description: Safe consent metadata without student, tenant or actor identifiers}, '400': {description: Age, notice or purpose validation failure}}}
  /v1/me/consents/{consentId}/withdraw:
    post: {summary: Withdraw a consent record and stop related assessment processing, parameters: [{$ref: '#/components/parameters/consentId'}], responses: {'204': {description: Withdrawn}, '403': {description: Subject or authorized guardian required}}}
  /v1/me/expression-capabilities:
    get: {summary: Read the school policy and consent requirements for student-led expression support, responses: {'200': {description: Capability metadata without student content}, '403': {description: Student role required}}}
  /v1/me/expression-notices/{purpose}:
    get: {summary: Read the approved self-expression or optional visual-interaction notice, parameters: [{name: purpose, in: path, required: true, schema: {type: string, enum: [self_expression, visual_interaction]}}], responses: {'200': {description: Approved notice}, '403': {description: Age or policy restriction}}}
  /v1/me/support-recipients:
    get: {summary: List explicitly configured professional recipients for student support requests, responses: {'200': {description: Recipient metadata}, '503': {description: Recipient policy unavailable}}}
  /v1/me/expression-entries:
    get: {summary: List the authenticated student's expression metadata without plaintext notes, responses: {'200': {description: Entry metadata}}}
    post: {summary: Create an encrypted student-led expression entry after the current notice and consent are acknowledged, responses: {'201': {description: Created entry}, '200': {description: Idempotent retry}, '409': {description: Notice or idempotency conflict}, '413': {description: 8 KiB body limit}}}
  /v1/me/expression-entries/{entryId}:
    get: {summary: Read one own expression entry, parameters: [{$ref: '#/components/parameters/entryId'}], responses: {'200': {description: Decrypted own entry}, '404': {description: Outside owner scope}, '410': {description: Deleted or expired}}}
    delete: {summary: Delete one own expression entry, parameters: [{$ref: '#/components/parameters/entryId'}], responses: {'204': {description: Deleted}}}
  /v1/me/expression-entries/{entryId}/shares:
    post: {summary: Create one explicit, time-limited share for a configured professional recipient, parameters: [{$ref: '#/components/parameters/entryId'}], responses: {'201': {description: Share receipt}, '409': {description: Existing active share, stale notice or idempotency conflict}}}
  /v1/me/expression-shares:
    get: {summary: List own expression-share metadata, responses: {'200': {description: Share metadata}}}
  /v1/me/expression-shares/{shareId}/revoke:
    post: {summary: Revoke an active expression share, parameters: [{$ref: '#/components/parameters/shareId'}], responses: {'204': {description: Revoked}}}
  /v1/professional/expression-shares:
    get: {summary: List active shares addressed to the authenticated professional, responses: {'200': {description: Share metadata with student references}, '403': {description: Professional recipient permission required}}}
  /v1/professional/expression-shares/{shareId}:
    get: {summary: Read one explicitly shared expression entry, parameters: [{$ref: '#/components/parameters/shareId'}], responses: {'200': {description: Decrypted shared entry}, '404': {description: Share unavailable or outside recipient scope}}}
  /v1/me/support-requests:
    get: {summary: List own support-request lifecycle metadata, responses: {'200': {description: Request metadata}}}
    post: {summary: Create an explicit support request addressed to one configured professional recipient, responses: {'201': {description: Requested}, '200': {description: Idempotent retry}, '409': {description: Stale notice, invalid share or idempotency conflict}}}
  /v1/me/support-requests/{requestId}:
    get: {summary: Read one own support-request state, parameters: [{$ref: '#/components/parameters/requestId'}], responses: {'200': {description: Request state}, '404': {description: Outside owner scope}}}
  /v1/me/support-requests/{requestId}/cancel:
    post: {summary: Cancel an open own support request with optimistic version checking, parameters: [{$ref: '#/components/parameters/requestId'}], responses: {'200': {description: Cancelled}, '409': {description: Version conflict}}}
  /v1/professional/support-requests:
    get: {summary: List assigned support requests for the authenticated professional, responses: {'200': {description: Support inbox}, '403': {description: Professional support permission required}}}
  /v1/professional/support-requests/{requestId}:
    get: {summary: Read one assigned support request, parameters: [{$ref: '#/components/parameters/requestId'}], responses: {'200': {description: Request state}, '404': {description: Outside recipient scope}}}
  /v1/professional/support-requests/{requestId}/transitions:
    post: {summary: Acknowledge, start, schedule follow-up or complete an assigned support request with optimistic version checking, parameters: [{$ref: '#/components/parameters/requestId'}], responses: {'200': {description: Updated request}, '409': {description: Version or state conflict}}}
  /v1/professional/support-requests/{requestId}/notes:
    get: {summary: List encrypted support notes after recipient authorization, parameters: [{$ref: '#/components/parameters/requestId'}], responses: {'200': {description: Decrypted notes for assigned professional only}}}
    post: {summary: Add an encrypted minimum-necessary support note, parameters: [{$ref: '#/components/parameters/requestId'}], responses: {'201': {description: Note receipt}, '409': {description: Idempotency conflict}}}
  /v1/professional/support-escalations:
    get: {summary: Read metadata-only overdue support reminders, responses: {'200': {description: Escalation metadata}, '403': {description: Professional escalation permission required}}}
  /v1/admin/operations/support-escalate:
    post: {summary: Queue redacted reminders for support requests past their acknowledgement target, responses: {'200': {description: Escalation result}, '403': {description: Operations permission required}}}
  /v1/rights-requests/{requestId}/result:
    get: {summary: Download an approved access or correction result after authorization, parameters: [{$ref: '#/components/parameters/requestId'}], responses: {'200': {description: Rights result}, '403': {description: Not the requester or privacy role}}}
  /v1/me/rights-requests:
    get: {summary: List rights requests created by the authenticated student or guardian, responses: {'200': {description: Own request metadata without encrypted results}, '403': {description: Student or guardian role required}}}
  /v1/rights-requests:
    post: {summary: Submit an access, correction, deletion or withdrawal request, responses: {'201': {description: Request receipt}, '403': {description: Subject or rights permission required}}}
  /v1/admin/rights-requests:
    get: {summary: List scoped rights requests for privacy staff, responses: {'200': {description: Request queue without encrypted result bodies}, '403': {description: Privacy permission required}}}
  /v1/admin/rights-requests/{requestId}/complete:
    post:
      summary: Complete or reject a rights request with a reviewer rationale
      parameters: [{$ref: '#/components/parameters/requestId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [decision], properties: {decision: {type: string, enum: [complete, reject]}, decisionReason: {type: string, maxLength: 2000, description: Required when rejecting; stored encrypted and returned only through an authorized result request}}}}}
      responses: {'200': {description: Updated request metadata}, '400': {description: Rejection rationale required}, '403': {description: Rights management permission required}}
  /v1/admin/operations/status:
    get: {summary: Read redacted outbox and delivery counters, responses: {'200': {description: Operational status}, '403': {description: Operations permission required}}}
  /v1/admin/operations/requeue-dead-letters:
    post: {summary: Requeue bounded dead-letter events, responses: {'200': {description: Requeue result}, '400': {description: Invalid limit}}}
  /v1/admin/operations/escalate:
    post: {summary: Queue redacted reminders for unacknowledged cases, responses: {'200': {description: Escalation result}, '400': {description: Invalid approved interval}}}
  /v1/admin/retention/run:
    post: {summary: Expire derived exports and replay deletion tombstones, responses: {'200': {description: Retention result}, '403': {description: Operations permission required}}}
  /v1/admin/audit:
    get: {summary: Read a bounded metadata-only append-only audit view, responses: {'200': {description: Audit events without sensitive bodies}, '403': {description: Audit permission required}}}
  /v1/me:
    get: {summary: Current named user, responses: {'200': {description: User}}}
  /v1/me/tasks:
    get: {summary: Student's own assignments with server-authoritative scale, age, academic-year and availability checks, responses: {'200': {description: Tasks include available and availabilityReason; revoked, expired or malformed-year campaigns are not startable}}}
  /v1/me/scales:
    get: {summary: List only age-eligible, usable self-screening scale versions, responses: {'200': {description: Available scale catalog}}}
  /v1/self-screenings:
    post: {summary: Create a current-academic-year frequency-checked student self-screening task, responses: {'201': {description: Self-screening campaign and assignment metadata without tenant, participant or reservation internals}, '400': {description: Consent, age or annual frequency review required; the server rejects arbitrary academic years}}}
  /v1/me/tasks/{assignmentId}/attempts:
    post: {summary: Start an age/current-notice/consent/frequency-checked attempt; returns only a minimal attempt handle and revision metadata, parameters: [{$ref: '#/components/parameters/assignmentId'}], responses: {'201': {description: Attempt metadata plus the approved scale}, '400': {description: Consent, notice, age, frequency or time-window failure}}}
  /v1/attempts/{attemptId}/answers:
    put: {summary: Save a revision-safe draft, parameters: [{$ref: '#/components/parameters/attemptId'}], responses: {'200': {description: Saved}, '409': {description: Revision conflict}}}
  /v1/attempts/{attemptId}:
    get: {summary: Read the authenticated student's server-confirmed draft; attempt metadata excludes tenant, student, scale, assignment and submission internals, parameters: [{$ref: '#/components/parameters/attemptId'}], responses: {'200': {description: Draft}, '401': {description: Unauthorized}, '404': {description: Not found}, '409': {description: Attempt is no longer resumable}}}
  /v1/attempts/{attemptId}/submit:
    post: {summary: Idempotently freeze a submission and enqueue scoring, parameters: [{$ref: '#/components/parameters/attemptId'}], responses: {'202': {description: Scoring pending}, '409': {description: Idempotency conflict}}}
  /v1/me/profile-responses:
    post: {summary: Submit an approved custom background survey response, responses: {'201': {description: Stored encrypted response}, '400': {description: Schema or required-field validation failure}}}
  /v1/reports:
    get: {summary: Professional reports or released own reports, responses: {'200': {description: Reports}}}
  /v1/students/{studentId}/archive:
    get: {summary: Purpose-bound professional archive view, parameters: [{$ref: '#/components/parameters/studentId'}], responses: {'200': {description: Scoped archive}, '400': {description: Purpose required}, '404': {description: Outside professional scope}}}
  /v1/reports/{reportId}/approve:
    post: {summary: Professional report approval, parameters: [{$ref: '#/components/parameters/reportId'}], responses: {'204': {description: Approved}}}
  /v1/reports/{reportId}/release:
    post: {summary: Release an approved report to its allowed reader, parameters: [{$ref: '#/components/parameters/reportId'}], responses: {'204': {description: Released}}}
  /v1/reports/{reportId}/revoke:
    post: {summary: Revoke an approved or released report and invalidate dependent exports, parameters: [{$ref: '#/components/parameters/reportId'}], responses: {'204': {description: Revoked}, '400': {description: Revocation reason required}}}
  /v1/scales:
    post: {summary: Create an immutable synthetic or licensed scale-version draft, responses: {'201': {description: Draft scale}, '400': {description: Invalid provenance, age range or item schema}}}
  /v1/scales/{scaleId}/approve:
    post: {summary: Professionally approve a scale version after licensing and suitability checks, parameters: [{$ref: '#/components/parameters/scaleId'}], responses: {'200': {description: Approved scale}, '403': {description: Professional approval required}}}
  /v1/scales/{scaleId}/revoke:
    post: {summary: Revoke a scale version for new use without rewriting history, parameters: [{$ref: '#/components/parameters/scaleId'}], responses: {'204': {description: Revoked}}}
  /v1/campaigns:
    post: {summary: Create a draft screening or survey campaign with a participant snapshot, responses: {'201': {description: Draft campaign}, '400': {description: Invalid consecutive YYYY-YYYY academic year, time window or purpose}}}
  /v1/campaigns/{campaignId}/publish:
    post: {summary: Publish a campaign after consent, age, licensing and frequency checks, parameters: [{$ref: '#/components/parameters/campaignId'}], responses: {'200': {description: Scheduled or open campaign}, '409': {description: Frequency conflict}}}
  /v1/campaigns/{campaignId}/state:
    post: {summary: Advance or pause a campaign through the governed state machine, parameters: [{$ref: '#/components/parameters/campaignId'}], responses: {'200': {description: Updated campaign}, '400': {description: Invalid state transition}}}
  /v1/campaigns/{campaignId}/progress:
    get: {summary: Return operational completion counts without scores or risk levels, parameters: [{$ref: '#/components/parameters/campaignId'}], responses: {'200': {description: Campaign progress}}}
  /v1/campaigns/{campaignId}/frequency-exceptions:
    post: {summary: Record an independently approved same-year re-evaluation exception, parameters: [{$ref: '#/components/parameters/campaignId'}], responses: {'201': {description: Exception recorded; response includes only hasReason and never the approval explanation}, '400': {description: Missing professional approval evidence}}}
  /v1/risk-signals:
    post: {summary: Student self-help or professional manual signal, responses: {'201': {description: Human-review case created}}}
  /v1/cases:
    get: {summary: Professional case work queue without raw answers, responses: {'200': {description: Cases}}}
  /v1/cases/{caseId}/reviews:
    post: {summary: Confirm or dismiss a signal with a professional note, parameters: [{$ref: '#/components/parameters/caseId'}], responses: {'200': {description: Reviewed metadata only; encrypted notes and signal IDs are never returned}}}
  /v1/cases/{caseId}/acknowledgements:
    post: {summary: Record human receipt (not just message delivery), parameters: [{$ref: '#/components/parameters/caseId'}], responses: {'201': {description: Acknowledged metadata only}}}
  /v1/cases/{caseId}/assign:
    post: {summary: Assign a confirmed case to a scoped professional, parameters: [{$ref: '#/components/parameters/caseId'}], responses: {'200': {description: Assigned}, '403': {description: Case assignment permission required}}}
  /v1/cases/{caseId}/follow-ups:
    post: {summary: Record an authorized support, referral or follow-up note, parameters: [{$ref: '#/components/parameters/caseId'}], responses: {'201': {description: Follow-up metadata with hasNote only; note plaintext/ciphertext is never returned}, '403': {description: Case scope or care permission required}}}
  /v1/cases/{caseId}/closure-requests:
    post: {summary: Request case closure with a bounded professional rationale, parameters: [{$ref: '#/components/parameters/caseId'}], responses: {'200': {description: Closure metadata only; encrypted rationale is never returned}}}
  /v1/cases/{caseId}/closure-approvals:
    post: {summary: Independently approve a closure request, parameters: [{$ref: '#/components/parameters/caseId'}], responses: {'200': {description: Closed}}}
  /v1/imports/preview:
    post: {summary: Preview JSON-mapped spreadsheet rows before commit, responses: {'201': {description: Preview}}}
  /v1/imports/preview-csv:
    post: {summary: Preview bounded CSV upload, responses: {'201': {description: Preview}}}
  /v1/imports/preview-xlsx:
    post: {summary: Preview a bounded first worksheet without executing formulas/macros, responses: {'201': {description: Preview}}}
  /v1/imports/{batchId}/commit:
    post: {summary: Commit an unchanged, validated import preview, parameters: [{$ref: '#/components/parameters/batchId'}], responses: {'200': {description: Committed batch}, '409': {description: Preview hash or batch state conflict}}}
  /v1/admin/overview:
    get: {summary: Suppressed operational overview, responses: {'200': {description: Overview}}}
  /v1/analytics/summary:
    get: {summary: Whitelisted aggregate analytics with suppression, responses: {'200': {description: Aggregate rows}}}
  /v1/exports:
    post: {summary: Request a purpose-bound aggregate or approved-report export, responses: {'201': {description: Requested export job}, '400': {description: Scope or purpose required}}}
  /v1/exports/{jobId}/approve:
    post: {summary: Independently approve and materialize a short-lived export, parameters: [{$ref: '#/components/parameters/jobId'}], responses: {'200': {description: Ready export metadata}, '403': {description: Independent approval required}, '410': {description: Export request expired}}}
  /v1/exports/{jobId}/download:
    get: {summary: Re-authorize and download an approved export, parameters: [{$ref: '#/components/parameters/jobId'}], responses: {'200': {description: Export payload}, '403': {description: Scope or approval failure}, '410': {description: Expired export or revoked source report; encrypted payload is cleared}}}
  /v1/availability-slots:
    get: {summary: List future counselling windows scoped to the student or appointment manager, responses: {'200': {description: Available or operational slots}, '403': {description: Appointment permission required}}}
    post: {summary: Create a non-overlapping counselling availability window, responses: {'201': {description: Availability slot}, '403': {description: Appointment management permission required}, '409': {description: Counselor or room conflict}}}
  /v1/availability-slots/{slotId}/state:
    post: {summary: Block or reopen an unheld counselling window, parameters: [{$ref: '#/components/parameters/slotId'}], responses: {'200': {description: Updated slot}, '409': {description: Slot already has an active booking}}}
  /v1/appointments:
    get: {summary: List own or scoped appointment metadata without notes, responses: {'200': {description: Appointment list}, '403': {description: Appointment permission required}}}
    post:
      summary: Request a counselling appointment with an optional idempotency key
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [slotId], properties: {slotId: {type: string}, note: {type: string, maxLength: 1000, writeOnly: true}, idempotencyKey: {type: string, maxLength: 128}}}}}
      responses: {'201': {description: Booking receipt without encrypted note}, '409': {description: Slot unavailable or idempotency conflict}}
  /v1/appointments/{appointmentId}/state:
    post: {summary: Cancel own appointment or update a scoped operational state, parameters: [{$ref: '#/components/parameters/appointmentId'}], responses: {'200': {description: Updated appointment}, '403': {description: Scope or role failure}}}
  /v1/content:
    get: {summary: List tenant education drafts and review metadata without storage envelopes, responses: {'200': {description: Content management list}, '403': {description: Content workflow permission required}}}
    post: {summary: Create an education article, announcement or media draft, responses: {'201': {description: Draft content}, '400': {description: Invalid content or accessibility fields}}}
  /v1/content/public:
    get:
      security: []
      summary: Published age-filtered education content
      parameters: [{name: age, in: query, required: false, schema: {type: integer, minimum: 6, maximum: 19}, description: Filter content for an integer age; invalid values return 400}]
      responses: {'200': {description: Public content}, '400': {description: Invalid age filter}}
  /v1/content/{contentId}/retire:
    post:
      summary: Retire a published education item and hide its public media
      parameters: [{$ref: '#/components/parameters/contentId'}]
      responses: {'200': {description: Retired content}, '403': {description: Professional approval permission required}}
  /v1/content/{contentId}/publish:
    post:
      summary: Professionally publish an audited education item
      parameters: [{$ref: '#/components/parameters/contentId'}]
      responses: {'200': {description: Published content}, '403': {description: Professional approval permission required}}
  /v1/media-assets:
    post: {summary: Upload a bounded, type-checked education media asset to private storage after provider-backed scanning, responses: {'201': {description: Clean asset metadata}, '413': {description: Asset too large}, '503': {description: Private object storage or media scanner unavailable}}}
  /v1/content/public/{assetId}/media:
    get:
      security: []
      summary: Stream media only when linked to published content
      parameters: [{$ref: '#/components/parameters/assetId'}]
      responses: {'200': {description: Media bytes}, '404': {description: Unpublished or unknown asset}, '503': {description: Private object storage unavailable or integrity check failed}}
  /v1/admin/regional-analytics:
    get: {summary: Return approved, suppressed regional aggregates for platform operations, responses: {'200': {description: Regional aggregates}, '403': {description: Regional analytics permission required}}}
  /v1/admin/worker/drain:
    post: {summary: Drain a bounded outbox batch for operations, responses: {'200': {description: Worker result}, '403': {description: Operations permission required}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: opaque-session-token}
  parameters:
    assignmentId: {name: assignmentId, in: path, required: true, schema: {type: string}}
    attemptId: {name: attemptId, in: path, required: true, schema: {type: string}}
    consentId: {name: consentId, in: path, required: true, schema: {type: string}}
    batchId: {name: batchId, in: path, required: true, schema: {type: string}}
    reportId: {name: reportId, in: path, required: true, schema: {type: string}}
    caseId: {name: caseId, in: path, required: true, schema: {type: string}}
    campaignId: {name: campaignId, in: path, required: true, schema: {type: string}}
    scaleId: {name: scaleId, in: path, required: true, schema: {type: string}}
    assetId: {name: assetId, in: path, required: true, schema: {type: string}}
    linkId: {name: linkId, in: path, required: true, schema: {type: string}}
    studentId: {name: studentId, in: path, required: true, schema: {type: string}}
    jobId: {name: jobId, in: path, required: true, schema: {type: string}}
    requestId: {name: requestId, in: path, required: true, schema: {type: string}}
    userId: {name: userId, in: path, required: true, schema: {type: string}}
    contentId: {name: contentId, in: path, required: true, schema: {type: string}}
    slotId: {name: slotId, in: path, required: true, schema: {type: string}}
    appointmentId: {name: appointmentId, in: path, required: true, schema: {type: string}}
    entryId: {name: entryId, in: path, required: true, schema: {type: string}}
    shareId: {name: shareId, in: path, required: true, schema: {type: string}}
  schemas:
    Login:
      type: object
      oneOf:
        - required: [email, password]
        - required: [accessCode]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 12, writeOnly: true}
        mfaCode: {type: string, pattern: '^[0-9]{6}$', description: Optional RFC 6238 code for enrolled staff accounts}
        accessCode: {type: string, minLength: 20, writeOnly: true, description: One-time school-issued student credential; do not combine with password login}
