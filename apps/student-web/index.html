<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园心晴｜学生端</title><style>body{font:16px system-ui,sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem;color:#172033}section{background:#f5f7fb;padding:1rem;margin:1rem 0;border-radius:12px}button{padding:.65rem 1rem;border:0;border-radius:8px;background:#2854d7;color:#fff;cursor:pointer}button.secondary{background:#57657d}label{display:block;padding:.7rem;background:#fff;border-radius:8px;margin:.5rem 0}input{margin-right:.5rem}.notice{border-left:4px solid #2854d7;padding-left:.8rem}</style></head>
<body><h1>校园心晴 · 学生端</h1><p class="notice">这是合成演示。测评反馈不是诊断；如果你现在需要帮助，请联系学校心理老师或页面提供的人工支持渠道。</p><section><h2>登录</h2><form id="login"><input name="email" type="email" value="student@campus-mind.demo" required><input name="password" type="password" value="CampusMind-Demo-2026!" required><button>进入任务</button></form><p id="status"></p></section><section id="tasks" hidden><h2>我的任务</h2><div id="taskList"></div><button id="help" class="secondary">我想找人聊聊</button><div id="questions"></div></section><script>let token='',attempt=null,revision=0;const $=s=>document.querySelector(s);async function api(path,opts={}){opts.headers={...(opts.headers||{}),authorization:'Bearer '+token,'content-type':'application/json'};const r=await fetch(path,opts);const j=await r.json();if(!r.ok)throw new Error(j.error?.message||'请求失败');return j.data}$('#login').onsubmit=async e=>{e.preventDefault();try{const body=Object.fromEntries(new FormData(e.target));const r=await fetch('/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error?.message);token=j.data.token;$('#status').textContent='已登录';$('#tasks').hidden=false;const tasks=await api('/v1/me/tasks');$('#taskList').innerHTML=tasks.map(t=>`<p><b>${t.name}</b> · ${t.status}<br><button data-id="${t.id}">开始</button></p>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>start(b.dataset.id))}catch(err){$('#status').textContent=err.message}};async function start(id){try{const r=await api('/v1/me/tasks/'+id+'/attempts',{method:'POST',body:'{}'});attempt=r.attempt;revision=attempt.currentRevision;$('#questions').innerHTML='<h3>'+r.scale.title+'</h3>'+r.scale.items.map(q=>`<label>${q.prompt}<br><input type="radio" name="${q.id}" value="0"> 暂时不是<br><input type="radio" name="${q.id}" value="1"> 有时或经常</label>`).join('')+'<button id="save">保存并提交</button>';$('#save').onclick=submit}catch(err){$('#status').textContent=err.message}}async function submit(){const answers={};document.querySelectorAll('#questions input:checked').forEach(i=>answers[i.name]=Number(i.value));try{const saved=await api('/v1/attempts/'+attempt.id+'/answers',{method:'PUT',body:JSON.stringify({expectedRevision:revision,answers})});revision=saved.revision;const out=await api('/v1/attempts/'+attempt.id+'/submit',{method:'POST',body:JSON.stringify({idempotencyKey:crypto.randomUUID()+'-submit'})});$('#status').textContent='已提交。系统会将需要关注的线索交给心理专业人员人工复核；请等待学校反馈。'+JSON.stringify(out)}catch(err){$('#status').textContent=err.message}}$('#help').onclick=async()=>{try{const me=await api('/v1/me');await api('/v1/risk-signals',{method:'POST',body:JSON.stringify({studentId:me.id,level:'attention',reason:'学生主动申请人工支持'})});$('#status').textContent='求助请求已提交给学校支持流程。'}catch(err){$('#status').textContent=err.message}};</script></body></html>
