<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园心晴｜工作人员端</title><style>body{font:16px system-ui,sans-serif;max-width:920px;margin:2rem auto;padding:0 1rem;color:#172033}header{display:flex;justify-content:space-between;align-items:center}section{background:#f5f7fb;padding:1rem;margin:1rem 0;border-radius:12px}button{padding:.6rem 1rem;border:0;border-radius:8px;background:#2854d7;color:#fff;cursor:pointer}input{padding:.6rem;margin:.25rem;border:1px solid #ccd3e0;border-radius:6px}.muted{color:#5f6b82}.metric{display:inline-block;min-width:130px;padding:.75rem;background:white;border-radius:8px;margin:.3rem}</style></head>
<body><header><h1>校园心晴 · 工作人员端</h1><span class="muted">演示环境｜不含真实学生资料</span></header>
<section><h2>登录</h2><form id="login"><input name="email" type="email" value="admin@campus-mind.demo" required><input name="password" type="password" value="CampusMind-Demo-2026!" required><button>登录</button></form><p id="status" class="muted"></p></section>
<section id="dashboard" hidden><h2>校级概览</h2><div id="metrics"></div><p class="muted">聚合数据可能因小样本被抑制；此页面不展示学生心理分数。</p><button id="refresh">刷新</button><button id="logout">退出</button><h2>测评任务</h2><div id="campaigns"></div><form id="campaignForm"><input name="name" placeholder="任务名称" value="合成演示任务" required><input name="academicYear" value="2026-2027" required><input name="opensAt" type="datetime-local" required><input name="closesAt" type="datetime-local" required><select name="scaleVersionId" id="scale" required></select><button>创建草稿</button></form><p class="muted">发布前仍需满足适龄、参与、频次、量表和专业门槛；校务账号不能查看分数。</p></section>
<script>let token='';const $=s=>document.querySelector(s);$('#login').addEventListener('submit',async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));const r=await fetch('/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok){$('#status').textContent=j.error?.message||'登录失败';return}token=j.data.token;$('#dashboard').hidden=false;$('#status').textContent='已登录：'+j.data.user.displayName;load()});async function load(){const r=await fetch('/v1/admin/overview',{headers:{authorization:'Bearer '+token}});const j=await r.json();if(!r.ok){$('#status').textContent=j.error?.message||'无权访问';return}$('#metrics').innerHTML=Object.entries(j.data).filter(([k])=>!['note'].includes(k)).map(([k,v])=>`<span class="metric"><b>${k}</b><br>${v===null?'已抑制':v}</span>`).join('');const [campaigns,scales]=await Promise.all([fetch('/v1/admin/campaigns',{headers:{authorization:'Bearer '+token}}).then(r=>r.json()),fetch('/v1/admin/scales',{headers:{authorization:'Bearer '+token}}).then(r=>r.json())]);$('#campaigns').innerHTML=(campaigns.data||[]).map(c=>`<p><b>${c.name}</b> · ${c.state} · ${c.participantCount} 人</p>`).join('')||'<p class=muted>暂无任务</p>';$('#scale').innerHTML=(scales.data||[]).filter(x=>x.status==='approved').map(x=>`<option value="${x.id}">${x.title} ${x.version}</option>`).join('')}$('#refresh').onclick=load;$('#campaignForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.schoolId='school-demo';f.purpose='screening';f.participantStudentIds=['student-demo'];f.opensAt=new Date(f.opensAt).toISOString();f.closesAt=new Date(f.closesAt).toISOString();const r=await fetch('/v1/campaigns',{method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:JSON.stringify(f)});const j=await r.json();$('#status').textContent=r.ok?'已创建草稿':j.error?.message||'创建失败';if(r.ok)load()};$('#logout').onclick=async()=>{await fetch('/v1/auth/logout',{method:'POST',headers:{authorization:'Bearer '+token}});token='';$('#dashboard').hidden=true;$('#status').textContent='已退出'};</script></body></html>
