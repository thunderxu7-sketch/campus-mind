<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>校园心晴｜工作人员端</title>
  <style>body{font:16px system-ui,sans-serif;max-width:920px;margin:2rem auto;padding:0 1rem;color:#172033;line-height:1.55}header{display:flex;justify-content:space-between;align-items:center;gap:1rem}section{background:#f5f7fb;padding:1rem;margin:1rem 0;border-radius:12px}button{padding:.6rem 1rem;border:0;border-radius:8px;background:#2854d7;color:#fff;cursor:pointer;font:inherit}button.secondary{background:#57657d}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}input,select{padding:.6rem;margin:.25rem;border:1px solid #ccd3e0;border-radius:6px;font:inherit}.muted{color:#5f6b82}.metric{display:inline-block;min-width:130px;padding:.75rem;background:white;border-radius:8px;margin:.3rem}.status{min-height:1.6em}@media (max-width:600px){header{display:block}input,select,button{width:100%;box-sizing:border-box;margin:.25rem 0}}
  </style>
</head>
<body>
  <header><h1>校园心晴 · 工作人员端</h1><span class="muted">演示环境｜不含真实学生资料</span></header>
  <section aria-labelledby="login-title">
    <h2 id="login-title">登录</h2>
    <form id="login">
      <label for="email">邮箱</label>
      <input id="email" name="email" type="email" autocomplete="username" value="admin@campus-mind.demo" required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" value="CampusMind-Demo-2026!" required>
      <label for="mfa-code">二次验证码（演示可留空）</label>
      <input id="mfa-code" name="mfaCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6">
      <button type="submit">登录</button>
    </form>
    <p id="status" class="muted status" role="status" aria-live="polite"></p>
  </section>

  <section id="dashboard" hidden aria-labelledby="dashboard-title">
    <h2 id="dashboard-title">校级概览</h2>
    <div id="metrics" aria-live="polite"></div>
    <p class="muted">聚合数据可能因小样本被抑制；此页面不展示学生心理分数。</p>
    <div><button id="refresh" type="button">刷新</button> <button id="logout" type="button" class="secondary">退出</button></div>
    <h2>测评任务</h2>
    <div id="campaigns" aria-live="polite"></div>
    <form id="campaignForm">
      <label for="campaign-name">任务名称</label><input id="campaign-name" name="name" placeholder="任务名称" value="合成演示任务" required>
      <label for="academic-year">学年</label><input id="academic-year" name="academicYear" value="2026-2027" required>
      <label for="opens-at">开始时间</label><input id="opens-at" name="opensAt" type="datetime-local" required>
      <label for="closes-at">结束时间</label><input id="closes-at" name="closesAt" type="datetime-local" required>
      <label for="scale">量表版本</label><select name="scaleVersionId" id="scale" required></select>
      <button type="submit">创建草稿</button>
    </form>
    <p class="muted">发布前仍需满足适龄、参与、频次、量表和专业门槛；校务账号不能查看分数。</p>
    <h2>咨询排班与预约</h2>
    <p class="muted">预约不是即时咨询或紧急救助。这里只展示时间、状态和最小身份引用，不展示心理说明。</p>
    <form id="slotForm">
      <label for="slot-counselor">咨询师用户编号</label><input id="slot-counselor" name="counselorId" value="user-counselor-demo" required>
      <label for="slot-starts">开始时间</label><input id="slot-starts" name="startsAt" type="datetime-local" required>
      <label for="slot-ends">结束时间</label><input id="slot-ends" name="endsAt" type="datetime-local" required>
      <label for="slot-room">房间（可选）</label><input id="slot-room" name="room" maxlength="100" placeholder="合成咨询室">
      <button type="submit">创建排班</button>
    </form>
    <div id="slotList" aria-live="polite"><p class="muted">暂无未来排班</p></div>
    <h3>预约记录</h3>
    <div id="appointmentList" aria-live="polite"><p class="muted">暂无预约</p></div>
    <h2>无手机学生凭证</h2>
    <form id="credentialForm">
      <label for="credential-student">学生编号</label><input id="credential-student" name="studentId" value="student-demo" required>
      <label for="credential-ttl">有效期（分钟，5–1440）</label><input id="credential-ttl" name="ttlMinutes" type="number" min="5" max="1440" value="30" required>
      <button type="submit" class="secondary">签发一次性凭证</button>
    </form>
    <p id="credentialStatus" class="status" role="status" aria-live="polite">凭证只显示一次，请通过学校批准的线下渠道交付。</p>
    <h2>会话安全</h2>
    <form id="revokeForm">
      <label for="revoke-user">用户编号</label><input id="revoke-user" name="userId" value="student-demo" required>
      <button type="submit" class="secondary">撤销该用户会话</button>
    </form>
    <p id="revokeStatus" class="status" role="status" aria-live="polite">共享终端遗失或人员离岗时，可撤销活跃会话及未兑换凭证。</p>
  </section>

  <script>
    let token = '';
    const $ = (selector) => document.querySelector(selector);
    const esc = (value) => String(value).replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const setStatus = (message) => { $('#status').textContent = message; };

    $('#login').addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        const body = Object.fromEntries(new FormData(event.target));
        const response = await fetch('/v1/auth/login', { method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify(body) });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error?.message || '登录失败');
        token = payload.data.token;
        $('#dashboard').hidden = false;
        setStatus('已登录：' + payload.data.user.displayName);
        await load();
      } catch (error) { setStatus(error.message); }
    });

    async function load() {
      try {
        const headers = { authorization: 'Bearer ' + token };
        const overview = await fetch('/v1/admin/overview', { headers }).then((response) => response.json());
        if (!overview.data) throw new Error(overview.error?.message || '无权访问');
        $('#metrics').innerHTML = Object.entries(overview.data).filter(([key]) => key !== 'note').map(([key, value]) => `<span class="metric"><b>${esc(key)}</b><br>${esc(value === null ? '已抑制' : value)}</span>`).join('');
        const [campaigns, scales, slots, appointments] = await Promise.all([
          fetch('/v1/admin/campaigns', { headers }).then((response) => response.json()),
          fetch('/v1/admin/scales', { headers }).then((response) => response.json()),
          fetch('/v1/availability-slots', { headers }).then((response) => response.json()),
          fetch('/v1/appointments', { headers }).then((response) => response.json()),
        ]);
        $('#campaigns').innerHTML = (campaigns.data || []).map((campaign) => `<p><b>${esc(campaign.name)}</b> · ${esc(campaign.state)} · ${esc(campaign.participantCount)} 人</p>`).join('') || '<p class="muted">暂无任务</p>';
        $('#scale').innerHTML = (scales.data || []).filter((scale) => scale.status === 'approved').map((scale) => `<option value="${esc(scale.id)}">${esc(scale.title)} ${esc(scale.version)}</option>`).join('');
        renderSlots(slots.data || []);
        renderAppointments(appointments.data || []);
      } catch (error) { setStatus(error.message); }
    }

    const appointmentStateLabel = { requested: '待确认', confirmed: '已确认', completed: '已完成', cancelled: '已取消', no_show: '未到访' };
    const formatWhen = (value) => { const date = new Date(value); return Number.isFinite(date.getTime()) ? date.toLocaleString() : '时间不可用'; };
    function renderSlots(slots) {
      $('#slotList').innerHTML = slots.length ? slots.map((slot) => {
        const action = slot.status === 'held' ? '<span class="muted">已有预约</span>' : `<button type="button" class="secondary" data-slot-id="${esc(slot.id)}" data-slot-status="${slot.status === 'blocked' ? 'available' : 'blocked'}">${slot.status === 'blocked' ? '重新开放' : '停用时段'}</button>`;
        return `<p class="metric"><b>${esc(slot.counselorName)}</b><br>${esc(formatWhen(slot.startsAt))}–${esc(formatWhen(slot.endsAt))}<br>${slot.room ? `房间：${esc(slot.room)}<br>` : ''}状态：${esc(slot.status)}<br>${action}</p>`;
      }).join('') : '<p class="muted">暂无未来排班</p>';
      document.querySelectorAll('[data-slot-id]').forEach((button) => { button.onclick = () => updateSlot(button.dataset.slotId, button.dataset.slotStatus); });
    }
    function renderAppointments(appointments) {
      $('#appointmentList').innerHTML = appointments.length ? appointments.map((appointment) => {
        const actions = appointment.state === 'requested' ? `<button type="button" data-appointment-id="${esc(appointment.id)}" data-appointment-state="confirmed">确认</button> <button type="button" class="secondary" data-appointment-id="${esc(appointment.id)}" data-appointment-state="cancelled">取消</button>` : appointment.state === 'confirmed' ? `<button type="button" data-appointment-id="${esc(appointment.id)}" data-appointment-state="completed">完成</button> <button type="button" class="secondary" data-appointment-id="${esc(appointment.id)}" data-appointment-state="no_show">标记未到访</button>` : '';
        return `<p class="task"><b>${esc(appointment.studentId || '学生')}</b> · ${esc(appointmentStateLabel[appointment.state] || appointment.state)}<br>${esc(formatWhen(appointment.startsAt))}–${esc(formatWhen(appointment.endsAt))} · ${esc(appointment.counselorName)}${appointment.room ? ` · ${esc(appointment.room)}` : ''}<br>${actions}</p>`;
      }).join('') : '<p class="muted">暂无预约</p>';
      document.querySelectorAll('[data-appointment-id]').forEach((button) => { button.onclick = () => updateAppointment(button.dataset.appointmentId, button.dataset.appointmentState); });
    }
    async function updateSlot(slotId, status) {
      try {
        const response = await fetch('/v1/availability-slots/' + encodeURIComponent(slotId) + '/state', { method: 'POST', headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' }, body: JSON.stringify({ status }) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error?.message || '排班更新失败');
        setStatus(status === 'blocked' ? '排班已停用' : '排班已重新开放');
        await load();
      } catch (error) { setStatus(error.message); }
    }
    async function updateAppointment(appointmentId, state) {
      try {
        const response = await fetch('/v1/appointments/' + encodeURIComponent(appointmentId) + '/state', { method: 'POST', headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' }, body: JSON.stringify({ state }) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error?.message || '预约状态更新失败');
        setStatus('预约状态已更新');
        await load();
      } catch (error) { setStatus(error.message); }
    }

    $('#refresh').onclick = load;
    $('#campaignForm').onsubmit = async (event) => {
      event.preventDefault();
      try {
        const form = Object.fromEntries(new FormData(event.target));
        const payload = { ...form, schoolId: 'school-demo', purpose: 'screening', participantStudentIds: ['student-demo'], opensAt: new Date(form.opensAt).toISOString(), closesAt: new Date(form.closesAt).toISOString() };
        const response = await fetch('/v1/campaigns', { method: 'POST', headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' }, body: JSON.stringify(payload) });
        const result = await response.json();
        setStatus(response.ok ? '已创建草稿' : result.error?.message || '创建失败');
        if (response.ok) await load();
      } catch (error) { setStatus(error.message); }
    };

    $('#slotForm').onsubmit = async (event) => {
      event.preventDefault();
      try {
        const form = Object.fromEntries(new FormData(event.target));
        const response = await fetch('/v1/availability-slots', { method: 'POST', headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' }, body: JSON.stringify({ counselorId: form.counselorId, startsAt: new Date(form.startsAt).toISOString(), endsAt: new Date(form.endsAt).toISOString(), room: form.room || undefined }) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error?.message || '排班创建失败');
        setStatus('排班已创建');
        await load();
      } catch (error) { setStatus(error.message); }
    };

    $('#credentialForm').onsubmit = async (event) => {
      event.preventDefault();
      try {
        const form = Object.fromEntries(new FormData(event.target));
        const response = await fetch('/v1/admin/student-credentials', { method: 'POST', headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' }, body: JSON.stringify({ studentId: form.studentId, ttlMinutes: Number(form.ttlMinutes) }) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error?.message || '签发失败');
        $('#credentialStatus').innerHTML = `一次性凭证（仅显示一次）：<code>${esc(result.data.code)}</code><br>有效期至 ${esc(result.data.expiresAt)}`;
      } catch (error) { $('#credentialStatus').textContent = error.message; }
    };

    $('#revokeForm').onsubmit = async (event) => {
      event.preventDefault();
      try {
        const form = Object.fromEntries(new FormData(event.target));
        const response = await fetch('/v1/admin/users/' + encodeURIComponent(form.userId) + '/sessions/revoke', { method: 'POST', headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' }, body: '{}' });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error?.message || '撤销失败');
        $('#revokeStatus').textContent = `已撤销 ${esc(result.data.revoked)} 个活跃会话；该用户未兑换凭证也已失效。`;
      } catch (error) { $('#revokeStatus').textContent = error.message; }
    };

    $('#logout').onclick = async () => {
      try { if (token) await fetch('/v1/auth/logout', { method: 'POST', headers: { authorization: 'Bearer ' + token } }); }
      finally { token = ''; $('#dashboard').hidden = true; $('#login').reset(); $('#credentialStatus').textContent = '凭证只显示一次，请通过学校批准的线下渠道交付。'; $('#revokeStatus').textContent = '共享终端遗失或人员离岗时，可撤销活跃会话及未兑换凭证。'; setStatus('已退出'); }
    };
  </script>
</body>
</html>
