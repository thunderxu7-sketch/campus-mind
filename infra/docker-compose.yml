# Optional local dependency sketch. Do not use for production or real student data.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campus_mind
      POSTGRES_USER: campus_mind_migration
      POSTGRES_PASSWORD: change-me-local-only
    ports: ["55432:5432"]
    volumes: ["campus-mind-pg:/var/lib/postgresql/data"]
    profiles: ["postgres"]
  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
    profiles: ["queue"]
volumes:
  campus-mind-pg:
